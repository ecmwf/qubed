[package]
name = "py_qubed_meteo"
version.workspace = true
edition = "2024"

[dependencies]
qubed = { workspace = true }
py_qubed = {path = "../../py_qubed"}
qubed_meteo = { path = "../qubed_meteo", features = ["opendata-support"] }
serde_json = "1.0.145"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }

[lib]
name = "qubed_meteo"
path = "src/lib.rs"
crate-type = ["cdylib"]
