name: CI

on:
  # Trigger the workflow on push to master or develop, except tag creation
  push:
    branches:
      - "main"
    tags-ignore:
      - "**"

  # Trigger the workflow on pull request
  pull_request: ~

  # Trigger the workflow manually
  workflow_dispatch: ~

  # Trigger after public PR approved for CI
  pull_request_target:
    types: [labeled]

jobs:
  checks-and-wheels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check workspace versions match
        run: |
          python3 - <<'EOF'
          import re, sys

          def workspace_version(path):
              in_section = False
              for line in open(path):
                  if line.strip() == "[workspace.package]":
                      in_section = True
                  elif line.strip().startswith("[") and in_section:
                      break
                  elif in_section:
                      m = re.match(r'\s*version\s*=\s*"([^"]+)"', line)
                      if m:
                          return m.group(1)
              raise ValueError(f"No version found in {path}")

          v1 = workspace_version("Cargo.toml")
          v2 = workspace_version("qubed_meteo/Cargo.toml")
          if v1 != v2:
              print(f"Version mismatch: Cargo.toml={v1!r}  qubed_meteo/Cargo.toml={v2!r}", file=sys.stderr)
              sys.exit(1)
          print(f"Workspace versions match: {v1}")
          EOF

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache Cargo registry + target to speed up Rust and extension builds.
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Create a dedicated venv for all Python/pip operations in this job, and
      # immediately harden pip + certifi inside it before installing anything
      # else. This protects against the compromised eMudhra (emSign)
      # intermediate CAs: several of their private keys were found to be weak,
      # and an attacker could use them to impersonate trusted sites such as
      # pypi.org/python.org. Tools that still trust those certificates (pip,
      # certifi, uv, ...) could be tricked into installing malicious packages.
      # Pinning pip to a known-good release (by hash) and upgrading certifi to
      # a version with the emSign root removed closes that gap before any
      # package is fetched from PyPI.
      - name: Set up hardened Python venv
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          .ci-venv/bin/python -m pip install --upgrade "certifi>=2026.10.19"

      - name: Install maturin
        run: .ci-venv/bin/python -m pip install maturin

      - name: Check Rust formatting (qubed workspace)
        run: cargo fmt -- --check

      - name: Check Rust formatting (qubed_meteo workspace)
        run: cargo fmt --manifest-path qubed_meteo/qubed_meteo/Cargo.toml -- --check

      - name: Run Rust tests (qubed workspace)
        run: cargo test -p qubed

      - name: Run Rust tests (qubed_meteo workspace)
        run: cargo test --manifest-path qubed_meteo/qubed_meteo/Cargo.toml

      # Build the two Python extension packages that wrap the Rust crates.
      - name: Build qubed wheel
        run: .ci-venv/bin/maturin build -m py_qubed/Cargo.toml

      - name: Build qubed-meteo wheel
        working-directory: qubed_meteo
        run: |
          ../.ci-venv/bin/maturin build \
            -m py_qubed_meteo/Cargo.toml

      # Install built wheels into the hardened venv and run pytest.
      - name: Run Python binding tests
        run: |
          .ci-venv/bin/python -m pip install pytest target/wheels/qubed-*.whl
          .ci-venv/bin/python -m pytest -q py_qubed/tests
          .ci-venv/bin/python -m pip install qubed_meteo/target/wheels/qubed_meteo-*.whl
          .ci-venv/bin/python -m pytest -q qubed_meteo/py_qubed_meteo/tests

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: |
            target/wheels/*.whl
            qubed_meteo/target/wheels/*.whl
