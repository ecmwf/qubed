name: Publish Python packages to PyPI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  PYTHON_VERSION: "3.11"

jobs:
  build-wheels:
    name: Build ${{ matrix.package }} (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        package: [py_qubed, py_qubed_meteo]
        # target: [x86_64, aarch64, x86_64-apple-darwin, aarch64-apple-darwin]
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
        # include:
        #   - target: x86_64-unknown-linux-gnu
        #     runner: ubuntu-latest
        #     manylinux: auto
        #   - target: aarch64-unknown-linux-gnu
        #     runner: ubuntu-latest
        #     manylinux: auto
        #   - target: x86_64-apple-darwin
        #     runner: macos-latest
        #     manylinux: 'off'
        #   - target: aarch64-apple-darwin
        #     runner: macos-latest
        #     manylinux: 'off'
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            manylinux: auto
            cflags: ""

          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            manylinux: auto
            cflags: "-D__ARM_ARCH=8"

          - target: x86_64-apple-darwin
            runner: macos-latest
            manylinux: "off"
            cflags: ""

          - target: aarch64-apple-darwin
            runner: macos-latest
            manylinux: "off"
            cflags: ""
          - package: py_qubed
            manifest_path: py_qubed/Cargo.toml
          - package: py_qubed_meteo
            manifest_path: qubed_meteo/py_qubed_meteo/Cargo.toml

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        env:
          CFLAGS_aarch64_unknown_linux_gnu: ${{ matrix.cflags }}
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: >
            --release
            --manifest-path ${{ matrix.manifest_path }}
            --out dist

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.package }}-${{ matrix.target }}
          path: dist/*.whl
  
  build-sdists:
    name: Build sdist (${{ matrix.package }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - package: py_qubed
            manifest_path: py_qubed/Cargo.toml
          - package: py_qubed_meteo
            manifest_path: qubed_meteo/py_qubed_meteo/Cargo.toml

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: >
            --manifest-path ${{ matrix.manifest_path }}
            --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist-${{ matrix.package }}
          path: dist/*.tar.gz

  test-wheels-linux:
    name: Test Linux wheels
    runs-on: ubuntu-latest
    needs: build-wheels

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Show wheels
        run: find dist -name '*.whl' | sort

      # Create a dedicated venv and immediately harden pip + certifi inside it
      # before installing anything else. This protects against the compromised
      # eMudhra (emSign) intermediate CAs: several of their private keys were
      # found to be weak, and an attacker could use them to impersonate trusted
      # sites such as pypi.org/python.org, tricking tools that still trust
      # those certificates (pip, certifi, uv, ...) into installing malicious
      # packages. Pinning pip to a known-good release (by hash) and upgrading
      # certifi to a version with the emSign root removed closes that gap
      # before any wheel is installed from this run's artifacts.
      - name: Set up hardened Python venv
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          .ci-venv/bin/python -m pip install --upgrade "certifi>=2026.10.19"

      - name: Install and test py_qubed
        run: |
          WHEEL=$(find dist -name 'qubed-*.whl' | grep manylinux | grep x86_64 | head -n1)
          echo "Installing $WHEEL"
          .ci-venv/bin/python -m pip install "$WHEEL"
          .ci-venv/bin/python -c "import qubed; print('qubed OK')"

      - name: Install and test py_qubed_meteo
        run: |
          WHEEL=$(find dist -name 'qubed_meteo-*.whl' | grep manylinux | grep x86_64 | head -n1)
          echo "Installing $WHEEL"
          .ci-venv/bin/python -m pip install "$WHEEL"
          .ci-venv/bin/python -c "import qubed_meteo; print('qubed_meteo OK')"

  test-wheels-macos:
    name: Test macOS wheels
    runs-on: macos-latest
    needs: build-wheels

    strategy:
      matrix:
        include:
          - package: py_qubed
            module: qubed

          - package: py_qubed_meteo
            module: qubed_meteo

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Show wheels
        run: find dist -name '*.whl' | sort

      # See the matching step in test-wheels-linux for why this hardening is
      # necessary (compromised eMudhra/emSign intermediate CAs).
      - name: Set up hardened Python venv
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          .ci-venv/bin/python -m pip install --upgrade "certifi>=2026.10.19"

      - name: Install wheel
        run: |
          if [ "${{ matrix.package }}" = "py_qubed" ]; then
            WHEEL=$(find dist -name 'qubed-*.whl' | grep macosx | grep arm64 | head -n1)
          else
            WHEEL=$(find dist -name 'qubed_meteo-*.whl' | grep macosx | grep arm64 | head -n1)
          fi

          echo "Installing $WHEEL"
          .ci-venv/bin/python -m pip install "$WHEEL"

      - name: Run import test
        run: |
          .ci-venv/bin/python -c "import ${{ matrix.module }}; print('${{ matrix.module }} OK')"

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test-wheels-linux, test-wheels-macos, build-sdists, build-wheels]

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # See test-wheels-linux for why this hardening is necessary (compromised
      # eMudhra/emSign intermediate CAs). This is especially important here
      # since this job uploads release artifacts to PyPI using a real token.
      - name: Set up hardened Python venv
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          .ci-venv/bin/python -m pip install --upgrade "certifi>=2026.10.19"

      - name: Install maturin
        run: .ci-venv/bin/python -m pip install maturin

      - name: List wheels
        run: find dist -name '*.whl' | sort
      
      - name: Install twine
        run: .ci-venv/bin/python -m pip install twine

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          find dist -type f \( -name '*.whl' -o -name '*.tar.gz' \) -print0 |
            xargs -0 .ci-venv/bin/twine upload
